name: Build desktop wallet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_wallet.py --smoke-test
      - run: python -m PyInstaller --noconfirm --clean ElectrumXRP.spec
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: ./dist/ElectrumXRP/ElectrumXRP --smoke-test
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\ElectrumXRP\ElectrumXRP.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf dist/ElectrumXRP-Linux-x64.tar.gz -C dist ElectrumXRP
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ElectrumXRP -DestinationPath dist/ElectrumXRP-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ElectrumXRP-${{ runner.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
